name: Send Album to Bangkok (Every 8 Hours)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send album to BANGKOK CITY
        run: python send_album_aladdin.py -1001538841756 9015499752:AAE63es_CeMirbJ2RWVAFTPsxqT9GBX9ZWk
