name: Send Album to Group JB (Every 3 Hours)

on:
  schedule:
    - cron: '0 */3 * * *'   # 每3小时（UTC）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send album to Group JB
